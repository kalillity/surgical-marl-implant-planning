[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "surgical-marl-planning"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["torch==2.5.1", "numpy==2.1.3", "PyYAML==6.0.2"]

[project.scripts]
surgical-marl-train = "surgical_marl_planning.cli.train:main"
surgical-marl-evaluate = "surgical_marl_planning.cli.evaluate:main"
surgical-marl-infer = "surgical_marl_planning.cli.infer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

